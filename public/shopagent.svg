<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyanblue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cyanblueV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g opacity="0.06">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M100 0 V630 M300 0 V630 M500 0 V630 M700 0 V630 M900 0 V630 M1100 0 V630" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Glow blobs -->
  <circle cx="150" cy="120" r="140" fill="#22d3ee" opacity="0.10" filter="url(#glow)"/>
  <circle cx="1050" cy="520" r="160" fill="#3b82f6" opacity="0.10" filter="url(#glow)"/>

  <!-- Title -->
  <text x="60" y="72" font-family="ui-monospace, monospace" font-size="30" fill="#ffffff" font-weight="700">ShopAgent</text>
  <text x="60" y="100" font-family="ui-monospace, monospace" font-size="15" fill="#9ca3af">agentic commerce — LangGraph + MCP + Razorpay</text>
  <rect x="60" y="112" width="90" height="3" fill="url(#cyanblue)"/>

  <!-- ===== Node: Buyer Agent ===== -->
  <rect x="60" y="180" width="320" height="150" rx="16" fill="#0d1117" stroke="#22d3ee" stroke-width="1.5" opacity="0.95"/>
  <rect x="60" y="180" width="320" height="150" rx="16" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.35" filter="url(#glow)"/>
  <text x="86" y="216" font-family="ui-monospace, monospace" font-size="17" fill="#22d3ee" font-weight="700">LangGraph Buyer Agent</text>
  <text x="86" y="246" font-family="ui-monospace, monospace" font-size="13" fill="#d1d5db">→ parse_intent</text>
  <text x="86" y="268" font-family="ui-monospace, monospace" font-size="13" fill="#d1d5db">→ rag_search / compare_options</text>
  <text x="86" y="290" font-family="ui-monospace, monospace" font-size="13" fill="#facc15">→ check_budget_guardrail (deterministic)</text>
  <text x="86" y="312" font-family="ui-monospace, monospace" font-size="13" fill="#d1d5db">→ checkout / confirm</text>

  <!-- ===== Node: MCP Catalog Server ===== -->
  <rect x="440" y="180" width="320" height="150" rx="16" fill="#0d1117" stroke="#3b82f6" stroke-width="1.5" opacity="0.95"/>
  <rect x="440" y="180" width="320" height="150" rx="16" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.35" filter="url(#glow)"/>
  <text x="466" y="216" font-family="ui-monospace, monospace" font-size="17" fill="#60a5fa" font-weight="700">MCP Catalog Server</text>
  <text x="466" y="246" font-family="ui-monospace, monospace" font-size="13" fill="#d1d5db">search_catalog (RAG / pgvector)</text>
  <text x="466" y="268" font-family="ui-monospace, monospace" font-size="13" fill="#d1d5db">get_product · check_inventory</text>
  <text x="466" y="290" font-family="ui-monospace, monospace" font-size="13" fill="#d1d5db">apply_discount (bounded)</text>
  <text x="466" y="312" font-family="ui-monospace, monospace" font-size="13" fill="#d1d5db">create_order</text>

  <!-- ===== Node: Razorpay ===== -->
  <rect x="820" y="180" width="320" height="150" rx="16" fill="#0d1117" stroke="#a855f7" stroke-width="1.5" opacity="0.95"/>
  <rect x="820" y="180" width="320" height="150" rx="16" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.30" filter="url(#glow)"/>
  <text x="846" y="216" font-family="ui-monospace, monospace" font-size="17" fill="#c084fc" font-weight="700">Razorpay (test-mode)</text>
  <text x="846" y="246" font-family="ui-monospace, monospace" font-size="13" fill="#d1d5db">order creation</text>
  <text x="846" y="268" font-family="ui-monospace, monospace" font-size="13" fill="#d1d5db">HMAC-verified webhook</text>
  <text x="846" y="290" font-family="ui-monospace, monospace" font-size="13" fill="#d1d5db">confirm_payment</text>

  <!-- Arrows between nodes -->
  <line x1="380" y1="255" x2="436" y2="255" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="255" x2="816" y2="255" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Bottom: Audit Trail bar ===== -->
  <rect x="60" y="400" width="1080" height="110" rx="16" fill="#0d1117" stroke="#374151" stroke-width="1.5"/>
  <rect x="60" y="400" width="6" height="110" fill="url(#cyanblueV)"/>
  <text x="90" y="432" font-family="ui-monospace, monospace" font-size="16" fill="#ffffff" font-weight="700">Audit Trail (Postgres)</text>
  <text x="90" y="458" font-family="ui-monospace, monospace" font-size="13" fill="#9ca3af">run_id · node · decision · reasoning · tokens_used · latency_ms</text>
  <text x="90" y="480" font-family="ui-monospace, monospace" font-size="13" fill="#4ade80">✓ every money action explainable, bounded, and gated</text>

  <!-- connecting lines down to audit trail -->
  <line x1="220" y1="330" x2="220" y2="400" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="600" y1="330" x2="600" y2="400" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="980" y1="330" x2="980" y2="400" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- footer tags -->
  <g font-family="ui-monospace, monospace" font-size="13" fill="#6b7280">
    <text x="60" y="560">Python</text>
    <text x="140" y="560">·</text>
    <text x="160" y="560">LangGraph</text>
    <text x="270" y="560">·</text>
    <text x="290" y="560">MCP</text>
    <text x="340" y="560">·</text>
    <text x="360" y="560">pgvector</text>
    <text x="460" y="560">·</text>
    <text x="480" y="560">Redis</text>
    <text x="550" y="560">·</text>
    <text x="570" y="560">Gemini</text>
    <text x="655" y="560">·</text>
    <text x="675" y="560">Razorpay</text>
  </g>

  <text x="1140" y="600" font-family="ui-monospace, monospace" font-size="13" fill="#4b5563" text-anchor="end">In Progress</text>
</svg>
