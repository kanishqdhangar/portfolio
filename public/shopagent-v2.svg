<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyanblue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <circle cx="150" cy="120" r="180" fill="#22d3ee" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1080" cy="540" r="200" fill="#3b82f6" opacity="0.12" filter="url(#glow)"/>

  <!-- Title -->
  <text x="60" y="100" font-family="ui-monospace, monospace" font-size="52" fill="#ffffff" font-weight="800">ShopAgent</text>
  <rect x="63" y="118" width="140" height="6" fill="url(#cyanblue)"/>
  <text x="900" y="95" font-family="ui-monospace, monospace" font-size="22" fill="#facc15" font-weight="700" text-anchor="end">IN PROGRESS</text>

  <!-- Three big nodes, icon-style, minimal text -->
  <!-- Node 1: Buyer Agent -->
  <rect x="60" y="200" width="330" height="220" rx="20" fill="#0d1117" stroke="#22d3ee" stroke-width="2.5"/>
  <rect x="60" y="200" width="330" height="220" rx="20" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.4" filter="url(#glow)"/>
  <circle cx="110" cy="255" r="22" fill="#22d3ee" opacity="0.15"/>
  <text x="110" y="264" font-size="24" text-anchor="middle">🤖</text>
  <text x="150" y="263" font-family="ui-monospace, monospace" font-size="26" fill="#22d3ee" font-weight="700">Buyer Agent</text>
  <text x="90" y="315" font-family="ui-monospace, monospace" font-size="20" fill="#e5e7eb">LangGraph</text>
  <text x="90" y="352" font-family="ui-monospace, monospace" font-size="20" fill="#e5e7eb">RAG search</text>
  <text x="90" y="389" font-family="ui-monospace, monospace" font-size="20" fill="#fde047">Budget guardrail</text>

  <!-- Arrow 1 -->
  <line x1="395" y1="310" x2="450" y2="310" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Node 2: MCP Catalog -->
  <rect x="455" y="200" width="330" height="220" rx="20" fill="#0d1117" stroke="#3b82f6" stroke-width="2.5"/>
  <rect x="455" y="200" width="330" height="220" rx="20" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.4" filter="url(#glow)"/>
  <circle cx="505" cy="255" r="22" fill="#3b82f6" opacity="0.15"/>
  <text x="505" y="264" font-size="24" text-anchor="middle">🗂️</text>
  <text x="545" y="263" font-family="ui-monospace, monospace" font-size="26" fill="#60a5fa" font-weight="700">MCP Catalog</text>
  <text x="485" y="315" font-family="ui-monospace, monospace" font-size="20" fill="#e5e7eb">search_catalog</text>
  <text x="485" y="352" font-family="ui-monospace, monospace" font-size="20" fill="#e5e7eb">check_inventory</text>
  <text x="485" y="389" font-family="ui-monospace, monospace" font-size="20" fill="#e5e7eb">create_order</text>

  <!-- Arrow 2 -->
  <line x1="790" y1="310" x2="845" y2="310" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Node 3: Razorpay -->
  <rect x="850" y="200" width="290" height="220" rx="20" fill="#0d1117" stroke="#a855f7" stroke-width="2.5"/>
  <rect x="850" y="200" width="290" height="220" rx="20" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.35" filter="url(#glow)"/>
  <circle cx="900" cy="255" r="22" fill="#a855f7" opacity="0.15"/>
  <text x="900" y="264" font-size="24" text-anchor="middle">💳</text>
  <text x="940" y="263" font-family="ui-monospace, monospace" font-size="26" fill="#c084fc" font-weight="700">Razorpay</text>
  <text x="880" y="315" font-family="ui-monospace, monospace" font-size="20" fill="#e5e7eb">Test-mode order</text>
  <text x="880" y="352" font-family="ui-monospace, monospace" font-size="20" fill="#e5e7eb">HMAC webhook</text>
  <text x="880" y="389" font-family="ui-monospace, monospace" font-size="20" fill="#e5e7eb">Audit trail</text>

  <!-- Bottom tag strip, big and bold -->
  <g font-family="ui-monospace, monospace" font-size="22" font-weight="600" fill="#9ca3af">
    <text x="60" y="500">Python</text>
    <text x="185" y="500" fill="#4b5563">·</text>
    <text x="205" y="500">LangGraph</text>
    <text x="370" y="500" fill="#4b5563">·</text>
    <text x="390" y="500">MCP</text>
    <text x="470" y="500" fill="#4b5563">·</text>
    <text x="490" y="500">pgvector</text>
    <text x="640" y="500" fill="#4b5563">·</text>
    <text x="660" y="500">Redis</text>
    <text x="760" y="500" fill="#4b5563">·</text>
    <text x="780" y="500">Gemini</text>
    <text x="920" y="500" fill="#4b5563">·</text>
    <text x="940" y="500">Razorpay</text>
  </g>

  <text x="60" y="570" font-family="ui-monospace, monospace" font-size="22" fill="#4ade80" font-weight="600">✓ Every money action explainable, bounded and gated</text>
</svg>
